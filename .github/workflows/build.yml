name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Set up Conveyor
        run: |
          curl -L -o conveyor.tar.gz "https://github.com/hydraulic-software/conveyor/releases/download/v10.3/conveyor-10.3-linux-amd64.tar.gz"
          tar -xzf conveyor.tar.gz
          mv conveyor-10.3-linux-amd64 conveyor
          echo "$(pwd)/conveyor" >> $GITHUB_PATH

      - name: Generate Windows Package
        run: conveyor make windows-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: shop-manager-windows-installer
          path: output/shop-manager-*.exe
